<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails - Air Force One</title>
    <link rel="stylesheet" href="sneakers-style.css">
</head>
<body>
    <div class="nav-back"><a href="shop.html">⬅️ Retour au shop</a></div>

    <div class="sneaker-detail-page">
        <div class="detail-grid">
            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=800" class="main-img">
            <div class="specs">
                <h1>Air Force One "Reflect"</h1>
                <p class="price">120,00 €</p>
                <h3>Pourquoi on l'adore ?</h3>
                <p>Un classique indémodable avec des finitions premium. Parfait pour tous les jours.</p>
                
                <div class="size-selector">
                    <strong>Disponibilité :</strong> En stock (38 au 45)
                </div>
                <button class="btn-cart">Ajouter au panier</button>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div id="chat-header">👟 SneakerCheck AI</div>
        <div id="chat-box">
            <p class="bot-msg">C'est un excellent choix ! Demandez-moi "taille" si vous hésitez.</p>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Posez une question...">
            <button id="send-btn">Envoyer</button>
        </div>
    </div>

    <script src="sneakers-bot.js"></script>
</body>
</html>
